name: My First GitHub Action

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls

      - name: Read index.html
        run: cat index.html

      - name: Install HTML Validator
        run: npm install -g html-validate

      - name: Test HTML
        run: html-validate index.html